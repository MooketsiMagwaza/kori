global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Deliver every rule in alerts.yml through Grafana's built-in Alertmanager, whose default
# notification policy posts to the Kori admin webhook. Without this block the rules are
# evaluated but nobody is told.
alerting:
  alertmanagers:
    - scheme: http
      path_prefix: /api/alertmanager/grafana
      basic_auth:
        username: admin
        password_file: /etc/prometheus/grafana-password
      static_configs:
        - targets: ["grafana:3000"]

scrape_configs:
  - job_name: kori-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: kori-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
