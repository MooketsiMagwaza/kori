apiVersion: 1

contactPoints:
  - orgId: 1
    name: Kori admin dashboard
    receivers:
      - uid: kori-admin-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://api:8000/api/admin/observability/grafana-webhook?secret=$GRAFANA_WEBHOOK_SECRET
          httpMethod: POST

policies:
  - orgId: 1
    receiver: Kori admin dashboard
    group_by: [grafana_folder, alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
