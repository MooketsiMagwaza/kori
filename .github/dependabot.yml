version: 2

# Monthly, grouped updates so routine bumps stay visible without flooding the repository.
# Security alerts stay active between these runs. Pattern from the owner's earlier platform.
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/field
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/landing
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/review
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/api-docs
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:20"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /database
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /ops/backups
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/field
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/landing
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/review
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/api-docs
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]
