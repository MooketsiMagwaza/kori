name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Name gate, shared sync, contrast, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-names.mjs
      - run: node scripts/sync-shared.mjs --check
      - run: node scripts/check-contrast.mjs
      - run: node --test "tests/*.test.ts"

  api:
    name: API (ruff, pytest, migrations on PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kori
          POSTGRES_PASSWORD: kori
          POSTGRES_DB: kori
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kori -d kori"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+psycopg://kori:kori@localhost:5432/kori
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Migrate an empty PostGIS database to head, check the seed, and back to base
        run: |
          alembic upgrade head
          python - <<'EOF'
          import os
          import psycopg
          url = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as conn:
              species = conn.execute('SELECT count(*) FROM "Species"').fetchone()[0]
              sensitive = conn.execute(
                  "SELECT count(*) FROM \"Species\" WHERE sensitivity = 'sensitive'"
              ).fetchone()[0]
              print(f"species={species} sensitive={sensitive}")
              assert species == 20 and sensitive == 3
          EOF
          alembic downgrade base

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile identity --profile recovery --profile drill config --quiet

  compose-smoke:
    name: Compose smoke test (database and API start and report healthy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db and api
        run: docker compose up -d --build --wait --wait-timeout 300 db api
      - name: Call the health endpoint
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | tee health.json
          python3 -c "import json; d=json.load(open('health.json')); print(d['status']); assert d['status'] == 'healthy'"
      - name: Show the API log
        if: always()
        run: docker compose logs --no-color --tail 80 api
      - name: Stop
        if: always()
        run: docker compose down -v

  apps:
    name: Lint, typecheck and build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [field, landing, review, api-docs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
