<!doctype html>
<html lang="en-BW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No signal · Kori</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.55;
        background: #f6f0e4; color: #1b1611; }
      @media (prefers-color-scheme: dark) { body { background: #14110d; color: #f5eee2; } a { color: #f4ae75; } }

      h1 { font-family: "Zilla Slab", Rockwell, Georgia, serif; font-size: 30px; line-height: 1.1; margin: 0; }
      p { margin: 0; }
      a { color: #8c3a0c; font-weight: 700; display: inline-flex; min-height: 48px; align-items: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>No signal, and this screen is not saved yet</h1>
      <p>Kori saves its screens the first time you open it with a connection. This one was not saved on this phone yet.</p>

      <a href="/">Go to Kori's home screen</a>
    </main>
